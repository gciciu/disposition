# CORS_ALLOW_ORIGIN must stay referenced (Symfony debug → 500 if unused).
# Local install/start-dev set CORS_ALLOW_ORIGIN='^.*$' (any Origin).
# Production: set a tight regex in .env.local / server env.
nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE', 'HEAD']
        allow_headers: '*'
        allow_private_network: true
        expose_headers: ['Link']
        max_age: 86400
    paths:
        '^/':
            allow_headers: '*'
            allow_private_network: true
