# CORS_ALLOW_ORIGIN must stay referenced (Symfony debug → 500 if unused).
# Local install/start-dev set CORS_ALLOW_ORIGIN='^.*$'.
# Production: tight regex in server env / .env.local.
nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE', 'HEAD']
        allow_headers: '*'
        allow_private_network: true
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/':
            allow_headers: '*'
            allow_private_network: true

# Dev: always emit ACAO even when regex check fails (Nelmio otherwise returns
# HTTP 200 with Allow-Methods but WITHOUT Access-Control-Allow-Origin).
when@dev:
    nelmio_cors:
        defaults:
            origin_regex: true
            allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
            forced_allow_origin_value: '*'
            allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE', 'HEAD']
            allow_headers: '*'
            allow_private_network: true
            expose_headers: ['Link']
            max_age: 86400
        paths:
            '^/':
                allow_headers: '*'
                allow_private_network: true
