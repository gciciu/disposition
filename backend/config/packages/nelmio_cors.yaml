nelmio_cors:
    defaults:
        origin_regex: true
        # Must stay referenced in every env (Symfony debug 500 if unused).
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: '*'
        allow_private_network: true
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/':
            allow_headers: '*'
            allow_private_network: true

# Local / Ubuntu (APP_ENV=dev): still use CORS_ALLOW_ORIGIN (keep env referenced).
# Installer / start-dev set CORS_ALLOW_ORIGIN='^.*$' for fully open local Origins.
when@dev:
    nelmio_cors:
        defaults:
            origin_regex: true
            allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
            allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE', 'HEAD']
            allow_headers: '*'
            allow_private_network: true
            expose_headers: ['Link']
            max_age: 86400
        paths:
            '^/':
                allow_headers: '*'
                allow_private_network: true
