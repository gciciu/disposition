nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        # String '*' (not ['*'] alone under a null path) — SPA sends Authorization +
        # X-Delivery-Authorization; browsers also ask for Accept/Content-Type.
        allow_headers: '*'
        # Firefox/Chrome local-dev preflight sends Access-Control-Request-Private-Network.
        # Default false → Nelmio returns 400 "Private Network Access is not allowed."
        allow_private_network: true
        expose_headers: ['Link']
        max_age: 3600
    paths:
        # Explicit path entry (not null) so defaults cannot be lost on merge.
        '^/':
            allow_headers: '*'
            allow_private_network: true
