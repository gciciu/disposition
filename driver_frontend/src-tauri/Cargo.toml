[package]
name = "driver-frontend"
version = "0.1.0"
description = "Delivery Driver"
authors = ["you"]
edition = "2021"

[lib]
name = "driver_frontend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-android-installer = "0.1.0"
tauri-plugin-upload = "2.5.0"
tauri-plugin-os = "2.4.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
